name: booker-tee

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booker_tee}
      POSTGRES_USER: ${POSTGRES_USER:-booker_tee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booker_tee}
    ports:
      - "${BOOKER_TEE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - booker_tee_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-booker_tee}:${POSTGRES_PASSWORD:-booker_tee}@postgres:5432/${POSTGRES_DB:-booker_tee}
      BOOKER_TEE_APP_NAME: ${BOOKER_TEE_APP_NAME:-Booker Tee}
      BOOKER_TEE_ENVIRONMENT: ${BOOKER_TEE_ENVIRONMENT:-local}
      BOOKER_TEE_DEBUG: ${BOOKER_TEE_DEBUG:-true}
      BOOKER_TEE_REGISTRATION_MODE: ${BOOKER_TEE_REGISTRATION_MODE:-open}
      BOOKER_TEE_PASSWORD_MIN_LENGTH: ${BOOKER_TEE_PASSWORD_MIN_LENGTH:-8}
      BOOKER_TEE_AUTH_SECRET_KEY: ${BOOKER_TEE_AUTH_SECRET_KEY:-change-this-local-auth-secret}
      BOOKER_TEE_REFRESH_COOKIE_NAME: ${BOOKER_TEE_REFRESH_COOKIE_NAME:-booker_refresh}
      BOOKER_TEE_ACCESS_TOKEN_MAX_AGE_SECONDS: ${BOOKER_TEE_ACCESS_TOKEN_MAX_AGE_SECONDS:-900}
      BOOKER_TEE_SESSION_COOKIE_SECURE: ${BOOKER_TEE_SESSION_COOKIE_SECURE:-false}
      BOOKER_TEE_SESSION_MAX_AGE_SECONDS: ${BOOKER_TEE_SESSION_MAX_AGE_SECONDS:-1209600}
      BOOKER_TEE_SESSION_IDLE_TIMEOUT_SECONDS: ${BOOKER_TEE_SESSION_IDLE_TIMEOUT_SECONDS:-43200}
      BOOKER_TEE_IDENTITY_EMAIL_ENABLED: ${BOOKER_TEE_IDENTITY_EMAIL_ENABLED:-false}
      BOOKER_TEE_IDENTITY_EMAIL_FROM: ${BOOKER_TEE_IDENTITY_EMAIL_FROM:-}
      BOOKER_TEE_SMTP_HOST: ${BOOKER_TEE_SMTP_HOST:-}
      BOOKER_TEE_SMTP_PORT: ${BOOKER_TEE_SMTP_PORT:-587}
      BOOKER_TEE_SMTP_USERNAME: ${BOOKER_TEE_SMTP_USERNAME:-}
      BOOKER_TEE_SMTP_PASSWORD: ${BOOKER_TEE_SMTP_PASSWORD:-}
      BOOKER_TEE_SMTP_STARTTLS: ${BOOKER_TEE_SMTP_STARTTLS:-true}
      BOOKER_TEE_ALLOWED_HOSTS: ${BOOKER_TEE_ALLOWED_HOSTS:-127.0.0.1,localhost,testserver}
      BOOKER_TEE_SECURITY_HEADERS_ENABLED: ${BOOKER_TEE_SECURITY_HEADERS_ENABLED:-true}
      BOOKER_TEE_UPLOAD_STORAGE_DIR: /app/var/uploads
      BOOKER_TEE_STATEMENT_UPLOAD_MAX_BYTES: ${BOOKER_TEE_STATEMENT_UPLOAD_MAX_BYTES:-20971520}
      BOOKER_TEE_CHAT_INTEGRATIONS_ENABLED: ${BOOKER_TEE_CHAT_INTEGRATIONS_ENABLED:-false}
      BOOKER_TEE_TELEGRAM_BOT_TOKEN: ${BOOKER_TEE_TELEGRAM_BOT_TOKEN:-}
      BOOKER_TEE_TELEGRAM_MODE: ${BOOKER_TEE_TELEGRAM_MODE:-polling}
      BOOKER_TEE_TELEGRAM_WEBHOOK_SECRET: ${BOOKER_TEE_TELEGRAM_WEBHOOK_SECRET:-}
      BOOKER_TEE_TELEGRAM_POLLING_TIMEOUT_SECONDS: ${BOOKER_TEE_TELEGRAM_POLLING_TIMEOUT_SECONDS:-30}
      BOOKER_TEE_PUBLIC_BASE_URL: ${BOOKER_TEE_PUBLIC_BASE_URL:-}
    ports:
      - "${BOOKER_TEE_APP_PORT:-8000}:8000"
    volumes:
      - ./alembic.ini:/app/alembic.ini:ro
      - ./docker/entrypoint.sh:/app/docker/entrypoint.sh:ro
      - ./migrations:/app/migrations:ro
      - ./src:/app/src:ro
      - booker_tee_uploads:/app/var/uploads
    command: ["sh", "/app/docker/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: node:22.22.0-bookworm-slim
    profiles: ["frontend"]
    user: node
    working_dir: /workspace/frontend
    environment:
      VITE_API_TARGET: http://app:8000
    ports:
      - "${BOOKER_TEE_FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/workspace
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  booker_tee_postgres_data:
  booker_tee_uploads:

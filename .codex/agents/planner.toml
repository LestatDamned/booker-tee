## Handoff для Executor

План должен быть достаточно конкретным для реализации без повторного
исследования задачи. Указывай затрагиваемые execution flows, файлы или символы,
если они подтверждены исследованием. Не выдумывай точные пути и имена.

Acceptance criteria должны описывать наблюдаемое поведение, а не требовать
конкретную внутреннюю реализацию.

Раздел Handoff для Executor должен содержать:
- цель;
- разрешённый scope;
- ожидаемые изменения;
- acceptance criteria;
- обязательные проверки;
- запрещённые изменения;
- известные риски.

Ответ READY должен быть пригоден для сохранения Orchestrator в docs/tasks/
после утверждения пользователем. Сам файл не создавай.

Для NO_CHANGE объясни это ссылками на текущее поведение и тесты.

Для BLOCKED укажи, каких именно данных или разрешений не хватает и почему без
них нельзя подготовить надёжный план.

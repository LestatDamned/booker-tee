name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://booker_tee:booker_tee@localhost:5432/booker_tee_test
      BOOKER_TEE_TEST_DATABASE_URL: postgresql+asyncpg://booker_tee:booker_tee@localhost:5432/booker_tee_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booker_tee_test
          POSTGRES_USER: booker_tee
          POSTGRES_PASSWORD: booker_tee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booker_tee -d booker_tee_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.15"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check .
      - name: Apply database migrations
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest
      - name: Audit production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/booker-tee-release-requirements.txt
          uvx pip-audit -r /tmp/booker-tee-release-requirements.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.15"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev

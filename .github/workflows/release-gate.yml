name: Release Gate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-gate-production
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=success -F per_page=1 \
            --jq '.total_count')
          test "$successful_runs" -gt 0

  production:
    name: Production images and smoke
    needs: verify-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run isolated production gate
        run: ./scripts/release-gate.sh

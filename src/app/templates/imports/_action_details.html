{% macro import_action_details(label, icon_name="settings") %}
  <details class="action-details action-accordion import-more-actions import-action-details">
    <summary class="import-action-details__summary">
      {{ icon(icon_name) }}
      <span>{{ label }}</span>
      <span class="details-toggle-label import-action-details__toggle" aria-hidden="true">
        <span class="details-toggle-open">Открыть</span>
        <span class="details-toggle-close">Закрыть</span>
      </span>
    </summary>
    <div class="action-menu import-action-details__menu">
      {{ caller() }}
    </div>
  </details>
{% endmacro %}

{% set payload = panel.payload %}

<div class="review-panel-body review-category-panel-body">
  <form class="action-group action-group-embedded review-panel-form review-category-form" method="post" action="{{ payload.action_url }}">
    {{ csrf_input() }}
    <input type="hidden" name="action" value="confirm">
    <div class="review-panel-grid review-category-grid">
      <div class="review-category-primary">
        <label class="field review-category-select">
          <span>Категория</span>
          <select name="category_id" aria-label="Категория">
            {% for option in payload.category_options %}
              <option value="{{ option.id }}" {% if option.selected %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
          </select>
        </label>
        <button
          class="inline-create-button review-inline-create"
          type="button"
          aria-label="Новая категория"
          title="Новая категория"
          @click.stop="openCategoryDialog($event)"
        >
          {{ icon("plus") }}
        </button>
      </div>
      <label class="field review-property-field">
        <span>Объект</span>
        <select name="property_id" aria-label="Объект">
          <option value="">без объекта</option>
          {% for option in payload.property_options %}
            <option value="{{ option.id }}" {% if option.selected %}selected{% endif %}>{{ option.label }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div class="review-rule-strip">
      <label class="remember-rule">
        <input type="checkbox" name="remember_rule" value="1">
        <span>Создать правило</span>
      </label>
      <input name="rule_pattern" placeholder="например, KRASNOE&BELOE">
    </div>
    <div class="review-panel-footer">
      <button class="button button-small primary-action" type="submit">{{ icon("check") }} Сохранить и подтвердить</button>
    </div>
  </form>

  {% include "imports/review/_category_dialog.html" %}
</div>

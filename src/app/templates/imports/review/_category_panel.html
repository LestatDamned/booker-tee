{% set payload = panel.payload %}

<div class="review-panel-body review-category-panel-body review-category-panel">
  <form class="row-drawer__form review-panel-form review-category-form review-category-panel__form" method="post" action="{{ payload.action_url }}">
    {{ csrf_input() }}
    <input type="hidden" name="action" value="confirm">
    <div class="review-panel-grid review-panel-form__fields review-category-grid review-category-panel__grid">
      <div class="review-category-primary review-category-panel__primary">
        <label class="field row-drawer__field review-category-select review-category-panel__field review-category-panel__field--category">
          <span>Категория</span>
          <select name="category_id" aria-label="Категория">
            {% for option in payload.category_options %}
              <option value="{{ option.id }}" {% if option.selected %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
          </select>
        </label>
        <button
          class="inline-create-button review-inline-create review-category-panel__create"
          type="button"
          aria-label="Новая категория"
          title="Новая категория"
          @click.stop="openCategoryDialog($event)"
        >
          {{ icon("plus") }}
        </button>
      </div>
      <label class="field row-drawer__field review-property-field review-category-panel__field review-category-panel__field--property">
        <span>Объект</span>
        <select name="property_id" aria-label="Объект">
          <option value="">без объекта</option>
          {% for option in payload.property_options %}
            <option value="{{ option.id }}" {% if option.selected %}selected{% endif %}>{{ option.label }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div class="review-rule-strip review-panel-form__section review-category-panel__rule">
      <label class="remember-rule review-category-panel__rule-toggle">
        <input type="checkbox" name="remember_rule" value="1">
        <span>Создать правило</span>
      </label>
      <input class="review-category-panel__rule-input" name="rule_pattern" placeholder="например, KRASNOE&BELOE">
    </div>
    <div class="row-drawer__footer review-panel-footer review-panel-form__footer review-category-panel__actions">
      <button class="button button-small primary-action review-category-panel__submit" type="submit">{{ icon("check") }} Сохранить и подтвердить</button>
    </div>
  </form>

  {% include "imports/review/_category_dialog.html" %}
</div>

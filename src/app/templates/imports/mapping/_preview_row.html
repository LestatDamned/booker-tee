<article class="mapping-preview-row{% if 'amount-income' in row.amount_class %} mapping-preview-row--income{% elif 'amount-expense' in row.amount_class %} mapping-preview-row--expense{% endif %}">
  <div class="mapping-preview-row__topline">
    <div class="mapping-preview-row__meta">
      <span>#{{ row.source_row_number }}</span>
      <span>{{ row.operation_date }}</span>
      <span class="badge {{ row.status_badge_class }}">{{ row.status_label }}</span>
      {% if row.posting_date %}
        <span>проводка {{ row.posting_date }}</span>
      {% endif %}
    </div>
    <strong class="mapping-preview-row__amount {{ row.amount_class }}">{{ row.amount }} <small>{{ row.currency }}</small></strong>
  </div>
  <div class="mapping-preview-row__description">{{ row.description }}</div>
  {% if row.error %}
    <div class="review-flags mapping-preview-row__error">
      <span>{{ row.error }}</span>
    </div>
  {% endif %}
</article>

{% if page.raw_transactions %}
  <h2 class="status">Сырые транзакции</h2>
  <div class="raw-transaction-list">
    {% for row in page.raw_transactions %}
      {% include "imports/_raw_transaction_row.html" %}
    {% endfor %}
  </div>
{% else %}
  <div class="empty-state import-detail-empty">
    <div class="empty-state-copy">
      <strong>{{ page.raw_empty_state.title }}</strong>
      <span>{{ page.raw_empty_state.message }}</span>
    </div>
  </div>
{% endif %}

<article class="financial-row financial-row--single raw-transaction-card import-raw-row{% if row.amount_tone %} import-raw-row--{{ row.amount_tone }}{% endif %}">
  <div class="financial-row__main import-raw-row__main">
    <div class="financial-row__topline raw-transaction-head import-raw-row__topline">
      <div class="financial-row__meta import-raw-row__meta">
        <span class="raw-transaction-index import-raw-row__index">#{{ row.row_index }}</span>
        <span class="financial-row__date raw-transaction-date import-raw-row__date">{{ row.display_date | date_ru }}</span>
        <span class="badge {{ row.status_css_class }} import-raw-row__status">{{ row.status_label }}</span>
      </div>
      <strong class="financial-row__amount raw-transaction-amount import-raw-row__amount{% if row.amount_tone %} amount-{{ row.amount_tone }}{% endif %}">{{ row.amount_label }} <small>{{ row.currency }}</small></strong>
    </div>

    <div class="financial-row__description entry-description import-raw-row__description">{{ row.description }}</div>
    {% if row.normalization_error %}
      <div class="ui-signal-list import-raw-row__flags">
        <span>{{ row.normalization_error }}</span>
      </div>
    {% endif %}
    <details class="technical-details raw-transaction-debug import-raw-row__debug">
      <summary>ID строки</summary>
      <span>ID попытки {{ row.parse_attempt_id }}</span>
    </details>
  </div>
</article>

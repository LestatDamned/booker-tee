<details class="action-details action-accordion filter-details" {% if manual_filters_active %}open{% endif %}>
  <summary>{{ icon("filter") }} фильтры списка</summary>
  <form class="form-panel form-panel-embedded" method="get" action="/ledger/manual">
    {% if focused_operation_id is defined and focused_operation_id %}
      <input type="hidden" name="operation_id" value="{{ focused_operation_id }}">
    {% endif %}
    <label class="field form-field-quarter">
      <span>с даты</span>
      <input name="date_from" type="date" value="{{ filters.date_from.isoformat() if filters is defined and filters.date_from else '' }}">
    </label>
    <label class="field form-field-quarter">
      <span>по дату</span>
      <input name="date_to" type="date" value="{{ filters.date_to.isoformat() if filters is defined and filters.date_to else '' }}">
    </label>
    <label class="field form-field-quarter">
      <span>тип</span>
      <select name="type">
        <option value="">любой</option>
        {% for operation_type in operation_types | default([]) %}
          <option value="{{ operation_type.value }}" {% if filters is defined and filters.operation_type == operation_type %}selected{% endif %}>{{ operation_type | ru }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field form-field-quarter">
      <span>статус</span>
      <select name="status">
        <option value="">любой</option>
        {% for status in operation_statuses | default([]) %}
          <option value="{{ status.value }}" {% if filters is defined and filters.status == status %}selected{% endif %}>{{ status | ru }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field form-field-quarter">
      <span>счет</span>
      <select name="account_id">
        <option value="">любой</option>
        {% for account in accounts %}
          <option value="{{ account.id }}" {% if filters is defined and filters.account_id == account.id %}selected{% endif %}>{{ account.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field form-field-quarter">
      <span>категория</span>
      <select name="category_id">
        <option value="">любая</option>
        {% for category in categories %}
          <option value="{{ category.id }}" {% if filters is defined and filters.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field form-field-quarter">
      <span>объект</span>
      <select name="property_id">
        <option value="">любой</option>
        {% for property in properties %}
          <option value="{{ property.id }}" {% if filters is defined and filters.property_id == property.id %}selected{% endif %}>{{ property.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field form-field-quarter">
      <span>на странице</span>
      <select name="per_page">
        {% for option in [25, 50, 100, 200] %}
          <option value="{{ option }}" {% if manual_page is defined and manual_page.per_page == option %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field form-field-half">
      <span>поиск</span>
      <input name="search" value="{{ filters.search if filters is defined and filters.search else '' }}" placeholder="Описание">
    </label>
    <div class="form-actions-inline">
      <button class="button" type="submit">{{ icon("filter") }} применить</button>
      <a class="button" href="/ledger/manual">сбросить</a>
    </div>
  </form>
</details>

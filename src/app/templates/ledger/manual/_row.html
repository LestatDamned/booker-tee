<article
  id="{{ row.id }}"
  class="financial-row manual-operation-row manual-operation-row--{{ row.tone }} {% if row.is_current %}manual-operation-row--current{% endif %} {% if row.is_inactive %}manual-operation-row--inactive{% endif %}"
  hx-boost="true"
  hx-select="#{{ row.id }}"
  hx-target="#{{ row.id }}"
  hx-swap="outerHTML show:none"
  hx-push-url="false"
  x-data="{ drawerOpen: false }"
>
  <div class="financial-row__main manual-operation-row__main">
    <div class="financial-row__topline manual-operation-row__topline">
      <span class="financial-row__date manual-operation-row__date">{{ row.date_label }}</span>
      {% if row.amount %}
        <strong class="financial-row__amount manual-operation-row__amount money-value money-{{ row.amount_direction }}">
          {{ row.amount }}{% if row.currency %} <small>{{ row.currency }}</small>{% endif %}
        </strong>
      {% endif %}
    </div>

    <div class="financial-row__description manual-operation-row__description">{{ row.description }}</div>

    <div class="financial-row__meta manual-operation-row__meta">
      {% for meta in row.meta %}
        <span {% if meta.tone %}class="financial-row__meta-item financial-row__meta-item--{{ meta.tone }}"{% else %}class="financial-row__meta-item"{% endif %}>{{ meta.label }}</span>
      {% endfor %}
    </div>
  </div>

  <aside class="financial-row__side manual-operation-row__side">
    {% include "ledger/manual/_row_actions.html" %}
  </aside>

  {% if can_write %}
    <div class="financial-row__drawer row-drawer manual-operation-row__drawer" x-show="drawerOpen" x-cloak>
      <div
        id="{{ row.edit_panel_id }}"
        class="manual-operation-row__edit-panel"
        aria-live="polite"
      >
        <p class="row-drawer__loading">Загружаем форму...</p>
      </div>
    </div>
  {% endif %}
</article>

<form id="new-manual-operation" class="manual-create-form operation-form operation-form--create" method="post" action="/ledger/manual" x-data="{ operationType: 'income' }">
  {{ csrf_input() }}
  <div class="manual-create-form__fields manual-create-form__fields--primary operation-form__fields operation-form__fields--primary">
    <div class="field operation-type-field manual-create-form__field manual-create-form__field--type operation-form__field operation-form__field--type">
      <span>тип операции</span>
      <div class="segmented-control" role="radiogroup" aria-label="Тип операции">
        <label class="segmented-option segmented-income">
          <input name="operation_type" type="radio" value="income" required checked x-model="operationType">
          <span>доход</span>
        </label>
        <label class="segmented-option segmented-expense">
          <input name="operation_type" type="radio" value="expense" required x-model="operationType">
          <span>расход</span>
        </label>
        <label class="segmented-option segmented-transfer">
          <input name="operation_type" type="radio" value="transfer" required x-model="operationType">
          <span>перевод</span>
        </label>
      </div>
    </div>
    <label class="field manual-create-form__field manual-create-form__field--amount operation-form__field operation-form__field--amount">
      <span>сумма</span>
      <input class="amount" name="amount" inputmode="decimal" placeholder="Сумма" required>
    </label>
    <label class="field manual-create-form__field manual-create-form__field--date operation-form__field operation-form__field--date">
      <span>дата</span>
      <input name="operation_date" inputmode="numeric" placeholder="дд.мм.гггг" pattern="\d{2}\.\d{2}\.\d{4}" required>
    </label>
  </div>

  <div class="manual-create-form__fields manual-create-form__fields--classification operation-form__fields operation-form__fields--classification">
    <label class="field manual-create-form__field operation-form__field">
      <span>счет</span>
      <select name="account_id" required>
        {% for account in accounts %}
          <option value="{{ account.id }}">{{ account.name }} · {{ account.currency }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field manual-create-form__field operation-form__field" x-show="operationType === 'transfer'" x-cloak>
      <span>счет назначения</span>
      <select name="destination_account_id" x-bind:disabled="operationType !== 'transfer'">
        <option value="">счет назначения</option>
        {% for account in accounts %}
          <option value="{{ account.id }}">{{ account.name }} · {{ account.currency }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field manual-create-form__field operation-form__field">
      <span>категория</span>
      <select name="category_id">
        <option value="">без категории</option>
        {% for category in categories %}
          <option value="{{ category.id }}">{{ category.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field manual-create-form__field operation-form__field">
      <span>объект</span>
      <select name="property_id">
        <option value="">без объекта</option>
        {% for property in properties %}
          <option value="{{ property.id }}">{{ property.name }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <div class="manual-create-form__bottom operation-form__footer">
    <label class="field manual-create-form__field manual-create-form__field--description operation-form__field operation-form__field--description">
      <span>описание</span>
      <input name="description" placeholder="Описание">
    </label>
    <button class="button primary-action manual-create-form__submit operation-form__submit" type="submit">{{ icon("plus") }} создать</button>
  </div>
</form>

{% set drawer = edit_panel.drawer %}

<div class="manual-operation-edit-panel-content">
  <form class="detached-form" id="{{ drawer.form_id }}" method="post" action="{{ drawer.form_action }}">{{ csrf_input() }}</form>

  <div class="row-drawer__header">
    <div class="row-drawer__heading">
      <h3 class="row-drawer__title">Исправить операцию</h3>
      <span class="row-drawer__context">{{ drawer.operation_type | ru }}</span>
    </div>
  </div>

  <div class="row-drawer__form manual-operation-row__drawer-form operation-form operation-form--drawer" x-data="{ operationType: '{{ drawer.operation_type.value }}' }">
    <div class="operation-form__fields operation-form__fields--primary">
      <div class="field row-drawer__field operation-type-field operation-form__field operation-form__field--type">
        <span>тип операции</span>
        <div class="segmented-control" role="radiogroup" aria-label="Тип операции">
          <label class="segmented-option segmented-income">
            <input name="operation_type" type="radio" value="income" form="{{ drawer.form_id }}" required {% if drawer.operation_type.value == "income" %}checked{% endif %} x-model="operationType">
            <span>доход</span>
          </label>
          <label class="segmented-option segmented-expense">
            <input name="operation_type" type="radio" value="expense" form="{{ drawer.form_id }}" required {% if drawer.operation_type.value == "expense" %}checked{% endif %} x-model="operationType">
            <span>расход</span>
          </label>
          <label class="segmented-option segmented-transfer">
            <input name="operation_type" type="radio" value="transfer" form="{{ drawer.form_id }}" required {% if drawer.operation_type.value == "transfer" %}checked{% endif %} x-model="operationType">
            <span>перевод</span>
          </label>
        </div>
      </div>
      <label class="field row-drawer__field operation-form__field operation-form__field--amount">
        <span>сумма</span>
        <input class="amount" name="amount" inputmode="decimal" value="{{ drawer.amount or '' }}" form="{{ drawer.form_id }}" required>
      </label>
      <label class="field row-drawer__field operation-form__field operation-form__field--date">
        <span>дата</span>
        <input name="operation_date" inputmode="numeric" value="{{ drawer.operation_date }}" form="{{ drawer.form_id }}" placeholder="дд.мм.гггг" pattern="\d{2}\.\d{2}\.\d{4}" required>
      </label>
    </div>

    <div class="operation-form__fields operation-form__fields--classification">
      <label class="field row-drawer__field operation-form__field">
        <span>счет</span>
        <select name="account_id" form="{{ drawer.form_id }}" required>
          {% for account in accounts %}
            <option value="{{ account.id }}" {% if drawer.account_id == account.id %}selected{% endif %}>
              {{ account.name }} · {{ account.currency }}
            </option>
          {% endfor %}
        </select>
      </label>
      <label class="field row-drawer__field operation-form__field" x-show="operationType === 'transfer'" x-cloak>
        <span>счет назначения</span>
        <select name="destination_account_id" form="{{ drawer.form_id }}" x-bind:disabled="operationType !== 'transfer'">
          <option value="">счет назначения</option>
          {% for account in accounts %}
            <option value="{{ account.id }}" {% if drawer.destination_account_id == account.id %}selected{% endif %}>
              {{ account.name }} · {{ account.currency }}
            </option>
          {% endfor %}
        </select>
      </label>
      <label class="field row-drawer__field operation-form__field">
        <span>категория</span>
        <select name="category_id" form="{{ drawer.form_id }}">
          <option value="">без категории</option>
          {% for category in categories %}
            <option value="{{ category.id }}" {% if drawer.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="field row-drawer__field operation-form__field">
        <span>объект</span>
        <select name="property_id" form="{{ drawer.form_id }}">
          <option value="">без объекта</option>
          {% for property in properties %}
            <option value="{{ property.id }}" {% if drawer.property_id == property.id %}selected{% endif %}>{{ property.name }}</option>
          {% endfor %}
        </select>
      </label>
    </div>

    <div class="operation-form__fields operation-form__fields--description">
      <label class="field row-drawer__field row-drawer__field--description operation-form__field operation-form__field--description">
        <span>описание</span>
        <input name="description" value="{{ drawer.description }}" form="{{ drawer.form_id }}" placeholder="Описание">
      </label>
    </div>

    <div class="row-drawer__footer operation-form__footer operation-form__footer--actions">
      {% if edit_panel.save_action %}
        {% set action = edit_panel.save_action %}
        {% include "ui/_action.html" %}
      {% endif %}
    </div>
  </div>
</div>

{% set drawer = edit_panel.drawer %}

<div class="account-movement-edit-panel-content">
  <div class="row-drawer__header account-movement__drawer-header">
    <div class="row-drawer__heading">
      <h3 class="row-drawer__title">{{ drawer.title }}</h3>
      <span class="row-drawer__context">{{ drawer.kind }}</span>
    </div>
  </div>
  <form class="row-drawer__form account-movement__drawer-form operation-form operation-form--drawer" method="post" action="{{ drawer.form_action }}">
    {{ csrf_input() }}
    <input type="hidden" name="version" value="{{ drawer.version }}">
    <div class="operation-form__fields operation-form__fields--primary">
      <label class="field row-drawer__field row-drawer__field--description account-movement__description-field operation-form__field operation-form__field--description">
        <span>описание</span>
        <input name="description" value="{{ drawer.description }}" placeholder="Описание">
      </label>
    </div>
    <div class="operation-form__fields operation-form__fields--classification">
      <label class="field row-drawer__field operation-form__field">
        <span>категория</span>
        <select name="category_id">
          <option value="">без категории</option>
          {% for category in categories | default([]) %}
            <option value="{{ category.id }}" {% if drawer.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="field row-drawer__field operation-form__field">
        <span>объект</span>
        <select name="property_id">
          <option value="">без объекта</option>
          {% for property in properties | default([]) %}
            <option value="{{ property.id }}" {% if drawer.property_id == property.id %}selected{% endif %}>{{ property.name }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div class="row-drawer__footer account-movement__drawer-submit operation-form__footer operation-form__footer--actions">
      <button class="button button-small primary-action operation-form__submit" type="submit">{{ icon("save") }} сохранить изменения</button>
    </div>
  </form>
</div>

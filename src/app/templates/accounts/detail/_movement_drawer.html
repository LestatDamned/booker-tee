{% if movement.drawer %}
  <div class="financial-row__drawer account-movement__drawer" x-show="drawerOpen" x-cloak>
    <div class="account-movement__drawer-header">
      <div>
        <p class="eyebrow">{{ movement.drawer.kind }}</p>
        <h3>{{ movement.drawer.title }}</h3>
      </div>
      {% if movement.drawer.source_url %}
        <a class="button button-small" href="{{ movement.drawer.source_url }}">{{ icon("refresh") }} строка импорта</a>
      {% endif %}
    </div>
    <form class="form-panel form-panel-embedded account-movement__drawer-form" method="post" action="{{ movement.drawer.form_action }}">
      {{ csrf_input() }}
      <label class="field account-movement__description-field">
        <span>описание</span>
        <input name="description" value="{{ movement.drawer.description }}" placeholder="Описание">
      </label>
      <label class="field">
        <span>статус</span>
        <select name="status">
          {% for status in operation_statuses | default([]) %}
            <option value="{{ status.value }}" {% if movement.drawer.status == status %}selected{% endif %}>{{ status | ru }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="field">
        <span>категория</span>
        <select name="category_id">
          <option value="">без категории</option>
          {% for category in categories | default([]) %}
            <option value="{{ category.id }}" {% if movement.drawer.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="field">
        <span>объект</span>
        <select name="property_id">
          <option value="">без объекта</option>
          {% for property in properties | default([]) %}
            <option value="{{ property.id }}" {% if movement.drawer.property_id == property.id %}selected{% endif %}>{{ property.name }}</option>
          {% endfor %}
        </select>
      </label>
      <div class="form-actions account-movement__drawer-submit">
        <button class="button button-small" type="submit">{{ icon("save") }} сохранить</button>
      </div>
    </form>
  </div>
{% endif %}

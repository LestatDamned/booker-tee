{% macro more_actions(class_name="", label="Еще действия", icon_name="list-check", menu_class=none) %}
  <details class="action-details action-accordion review-actions__secondary review-actions__details review-actions__menu ui-more-actions {{ class_name }}">
    <summary class="review-actions__summary ui-more-actions__summary">
      {{ icon(icon_name) }}
      <span>{{ label }}</span>
      <span class="details-toggle-label review-actions__toggle" aria-hidden="true">
        <span class="details-toggle-open">Открыть</span>
        <span class="details-toggle-close">Закрыть</span>
      </span>
    </summary>
    {% if menu_class %}
      <div class="{{ menu_class }}">
        {{ caller() }}
      </div>
    {% else %}
      {{ caller() }}
    {% endif %}
  </details>
{% endmacro %}

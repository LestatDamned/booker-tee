{% extends "base.html" %}

{% block styles %}
  <link rel="stylesheet" href="{{ url_for('web_static', path='/css/features/manual-ledger.css') }}?v={{ web_asset_version }}">
{% endblock %}

{% block content %}
  <header class="page-heading manual-ledger-heading">
    <div>
      <p class="page-heading__eyebrow">{{ workspace_name }} · Ручные операции</p>
      <h1>{{ heading }}</h1>
      <p class="page-heading__description">{{ description }}</p>
    </div>
    <a class="ui-button ui-button--secondary" href="{{ form.return_to }}">Вернуться к операциям</a>
  </header>

  <section class="manual-ledger-create manual-ledger-form-page" aria-labelledby="manual-ledger-form-title">
    <h2 id="manual-ledger-form-title" class="visually-hidden">{{ heading }}</h2>
    {% set inline_form = false %}
    {% include "features/ledger/manual/_form.html" %}
  </section>
{% endblock %}
